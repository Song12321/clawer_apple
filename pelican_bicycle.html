<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(#8ed8ff 0 64%, #dff6ff 64% 100%);
    }

    .stage {
      width: min(1100px, 100vw);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgb(24 86 117 / 20%);
      background: #8ed8ff;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .clouds {
      animation: clouds 18s linear infinite;
    }

    .clouds.slow {
      animation-duration: 30s;
      opacity: .72;
    }

    .road-lines {
      animation: road 1.1s linear infinite;
    }

    .rider {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: rider-bob .72s ease-in-out infinite alternate;
    }

    .head {
      transform-box: fill-box;
      transform-origin: 34% 82%;
      animation: head-bob .72s ease-in-out infinite alternate;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 18% 32%;
      animation: wing 1.44s ease-in-out infinite;
    }

    .leg-left,
    .leg-right {
      transform-box: fill-box;
      transform-origin: 50% 12%;
    }

    .leg-left {
      animation: leg-left .72s linear infinite;
    }

    .leg-right {
      animation: leg-right .72s linear infinite;
    }

    .wheel,
    .crank {
      transform-box: fill-box;
      transform-origin: center;
    }

    .wheel {
      animation: spin .72s linear infinite;
    }

    .crank {
      animation: spin .72s linear infinite;
    }

    .shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: shadow-pulse .72s ease-in-out infinite alternate;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes rider-bob {
      from { transform: translateY(0); }
      to { transform: translateY(-7px); }
    }

    @keyframes head-bob {
      from { transform: rotate(-1.5deg); }
      to { transform: rotate(3deg); }
    }

    @keyframes wing {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-9deg); }
    }

    @keyframes leg-left {
      0% { transform: rotate(18deg); }
      50% { transform: rotate(-22deg); }
      100% { transform: rotate(18deg); }
    }

    @keyframes leg-right {
      0% { transform: rotate(-22deg); }
      50% { transform: rotate(18deg); }
      100% { transform: rotate(-22deg); }
    }

    @keyframes shadow-pulse {
      from { transform: scaleX(1); opacity: .22; }
      to { transform: scaleX(.9); opacity: .14; }
    }

    @keyframes road {
      to { transform: translateX(-170px); }
    }

    @keyframes clouds {
      from { transform: translateX(0); }
      to { transform: translateX(-420px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
